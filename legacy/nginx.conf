# AI Tutor India - Production Nginx Configuration
# Place this in /etc/nginx/sites-available/aitutorindia.com
# Then symlink to /etc/nginx/sites-enabled/ and run: nginx -t && systemctl reload nginx
# SSL via: certbot --nginx -d aitutorindia.com -d www.aitutorindia.com

server {
    listen 80;
    listen [::]:80;
    server_name aitutorindia.com www.aitutorindia.com;
    
    # Redirect all HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aitutorindia.com www.aitutorindia.com;
    
    # Root directory
    root /var/www/aitutorindia.com;
    index index.html;
    
    # SSL Configuration (managed by certbot)
    # ssl_certificate /etc/letsencrypt/live/aitutorindia.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/aitutorindia.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    
    # SSL Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Security Headers
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https://www.google-analytics.com https://wa.me https://api.whatsapp.com; frame-src https://www.youtube.com https://www.youtube-nocookie.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https://wa.me;" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    
    # Performance: Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/woff
        font/woff2;
    
    # Performance: Brotli Compression (if module available)
    # brotli on;
    # brotli_vary on;
    # brotli_min_length 1024;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    
    # Cache Static Assets
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept-Encoding";
        access_log off;
    }
    
    # Cache HTML for short period (allows updates)
    location ~* \.html$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }
    
    # Cache manifest.json
    location = /manifest.json {
        expires 1d;
        add_header Cache-Control "public";
    }
    
    # Cache robots.txt and sitemap.xml
    location = /robots.txt {
        expires 1d;
        add_header Cache-Control "public";
    }
    
    location = /sitemap.xml {
        expires 1d;
        add_header Cache-Control "public";
    }
    
    # Main location - SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
        
        # Security for HTML responses
        add_header X-Content-Type-Options "nosniff" always;
    }
    
    # API proxy (if backend exists)
    # location /api/ {
    #     proxy_pass http://localhost:3000/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection 'upgrade';
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_cache_bypass $http_upgrade;
    #     proxy_read_timeout 30s;
    #     proxy_send_timeout 30s;
    # }
    
    # WhatsApp webhook endpoint (if needed)
    # location /webhook/whatsapp/ {
    #     proxy_pass http://localhost:3001/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
    
    # Block access to sensitive files
    location ~ /\.(git|env|htaccess|htpasswd) {
        deny all;
        return 404;
    }
    
    location ~ \.(json|xml|yml|yaml|md|log|sql|bak|backup)$ {
        deny all;
        return 404;
    }
    
    # Block access to backup files
    location ~* \.(bak|backup|old|orig|swp|tmp)$ {
        deny all;
        return 404;
    }
    
    # Rate limiting for form submissions
    limit_req_zone $binary_remote_addr zone=form_limit:10m rate=5r/m;
    
    location ~* /(signup|contact|checkout)/ {
        limit_req zone=form_limit burst=10 nodelay;
        limit_req_status 429;
    }
    
    # Error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    
    location = /404.html {
        internal;
    }
    
    location = /50x.html {
        internal;
    }
    
    # Logging
    access_log /var/log/nginx/aitutorindia.com.access.log combined;
    error_log /var/log/nginx/aitutorindia.com.error.log warn;
}

